<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiningOps Sphere Sandbox</title>
  <style>
    :root {
      --bg-top: #f7f1e5;
      --bg-bottom: #dbe7f3;
      --panel: rgba(255, 255, 255, 0.74);
      --text: #1f2933;
      --muted: #52606d;
      --line: rgba(31, 41, 51, 0.14);
      --accent: #1b4965;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(27, 73, 101, 0.22), transparent 28%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      width: min(380px, calc(100vw - 40px));
      padding: 1rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(31, 41, 51, 0.1);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.85rem;
      line-height: 1.05;
    }

    p {
      margin: 0 0 0.75rem;
      color: var(--muted);
    }

    ul {
      margin: 0;
      padding-left: 1rem;
    }

    li {
      margin-bottom: 0.35rem;
    }

    code {
      padding: 0.1rem 0.25rem;
      border-radius: 6px;
      background: rgba(31, 41, 51, 0.06);
    }

    .pill {
      display: inline-block;
      margin-top: 0.25rem;
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
      color: white;
      background: var(--accent);
      font-size: 0.86rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="hud">
      <div class="pill">Simple Product Baseline</div>
      <h1>Sphere 3D</h1>
      <p>This is the minimal 3D example to begin the pipeline: one sphere, one stage, one material baseline.</p>
      <ul>
        <li>Geometry: <code>SphereGeometry</code></li>
        <li>Position: <code>0, 1, 0</code></li>
        <li>Material: <code>MeshStandardMaterial</code></li>
        <li>Goal: validate render quality, controls, light and shadows first</li>
      </ul>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.177.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.177.0/examples/jsm/controls/OrbitControls.js";

    const app = document.getElementById("app");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#edf1f7");
    scene.fog = new THREE.Fog("#edf1f7", 12, 30);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4.2, 2.6, 6.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);

    const hemi = new THREE.HemisphereLight("#f9fbff", "#6d7b67", 1.2);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight("#fff7eb", 1.9);
    keyLight.position.set(5, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight("#c7d9ff", 0.45);
    fillLight.position.set(-4, 3, -2);
    scene.add(fillLight);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(9, 72),
      new THREE.MeshStandardMaterial({
        color: "#d8dfdd",
        roughness: 0.96,
        metalness: 0.02
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const shadowDisc = new THREE.Mesh(
      new THREE.CircleGeometry(1.6, 48),
      new THREE.MeshBasicMaterial({
        color: "#79808a",
        transparent: true,
        opacity: 0.18
      })
    );
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.position.y = 0.01;
    scene.add(shadowDisc);

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(1, 64, 64),
      new THREE.MeshStandardMaterial({
        color: "#8d3f3f",
        roughness: 0.22,
        metalness: 0.08
      })
    );
    sphere.position.set(0, 1, 0);
    sphere.castShadow = true;
    sphere.receiveShadow = true;
    scene.add(sphere);

    const axes = new THREE.AxesHelper(2.2);
    scene.add(axes);

    const grid = new THREE.GridHelper(12, 12, "#304050", "#8591a2");
    grid.position.y = 0.001;
    grid.material.opacity = 0.18;
    grid.material.transparent = true;
    scene.add(grid);

    const clock = new THREE.Clock();

    const animate = () => {
      const elapsed = clock.getElapsedTime();
      sphere.rotation.y = elapsed * 0.35;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    };

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
